[build]
  command = "npm install && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/hotelrates"
  to = "/.netlify/functions/hotelrates"
  status = 200

[[redirects]]
  from = "/api/crowdcalendar"
  to = "/.netlify/functions/crowdcalendar"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
